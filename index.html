<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Fotonotities</title>
</head>
<body>

<!-- ============ CAMERA ============ -->
<section id="scrCamera" class="screen active home">
  <header class="cam-top">
    <button id="btnProject" class="chip"><span id="projName">Kies project</span><i data-i="chevronDown"></i></button>
    <span id="gps" class="gps bad" title="Geen GPS"><i></i><b>GPS</b></span>
    <button id="btnSettings" class="glass" aria-label="Instellingen"><i data-i="settings"></i></button>
  </header>
  <div class="home-main">
    <div class="big-opts three">
      <div class="opt">
        <button id="btnGallery" class="shutter" aria-label="Uit galerij"><i data-i="image"></i></button>
        <div class="home-label">Uit galerij</div>
      </div>
      <div class="opt">
        <button id="btnNotes" class="shutter" aria-label="Notities"><i data-i="list"></i><span id="ntCount" class="cnt badge"></span></button>
        <div class="home-label">Notities</div>
      </div>
      <div class="opt">
        <button id="btnShutter" class="shutter" aria-label="Foto nemen"><i data-i="camera"></i></button>
        <div class="home-label">Foto nemen</div>
      </div>
    </div>
  </div>
  <div class="brand">Gard&amp;Co</div>
  <input type="file" id="fileGallery" accept="image/*" multiple hidden>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
</section>

<!-- ============ EDITOR ============ -->
<section id="scrEditor" class="screen">
  <header class="bar">
    <button id="edCancel" class="ibtn" aria-label="Annuleren"><i data-i="x"></i></button>
    <div class="ed-info">
      <button id="edTitle" class="ed-title"></button>
      <button id="edLoc" class="ed-loc"></button>
    </div>
  </header>
  <div class="stage" id="stage"><canvas id="edCanvas"></canvas></div>
  <div class="tools">
    <div class="seg-tools">
      <button data-tool="arrow" class="tool active" aria-label="Pijl"><i data-i="arrow"></i></button>
      <button data-tool="circle" class="tool" aria-label="Cirkel"><i data-i="circle"></i></button>
      <button data-tool="pen" class="tool" aria-label="Vrij tekenen"><i data-i="pen"></i></button>
    </div>
    <button id="edColor" class="tool color-btn" aria-label="Kleur"><span class="swatch"></span><i data-i="chevronDown"></i></button>
    <button id="edCrop" class="tool" aria-label="Bijsnijden"><i data-i="crop"></i></button>
    <button id="edUndo" class="tool" aria-label="Ongedaan maken"><i data-i="undo"></i></button>
    <div id="colorPop" class="color-pop hidden"></div>
  </div>
  <div class="crop-bar">
    <button id="cropCancel" class="text-btn">Annuleren</button>
    <button id="cropReset" class="text-btn">Volledig</button>
    <button id="cropDone" class="text-btn on">Bijsnijden</button>
  </div>
  <div class="tags" id="edTags"></div>
  <div class="note-row">
    <textarea id="edNote" rows="2" placeholder="Notitie — of tik op de microfoon van je toetsenbord" enterkeyhint="enter"></textarea>
    <button id="edSave" class="save" aria-label="Opslaan"><i data-i="check"></i></button>
  </div>
</section>

<!-- ============ NOTITIELIJST ============ -->
<section id="scrNotes" class="screen">
  <header class="bar">
    <button id="ntBack" class="ibtn" aria-label="Terug"><i data-i="chevronLeft"></i></button>
    <div class="select-wrap"><select id="ntProject"></select><i data-i="chevronDown"></i></div>
    <button id="ntView" class="ibtn" aria-label="Tegelweergave"><i data-i="grid"></i></button>
    <button id="ntSelect" class="text-btn">Selecteer</button>
    <button id="ntExport" class="text-btn exp-btn"><i data-i="share"></i><span>Export</span></button>
    <button id="ntMore" class="ibtn" aria-label="Meer"><i data-i="more"></i></button>
  </header>
  <div id="ntFilter" class="filter-bar"></div>
  <input type="file" id="fileImport" accept="image/jpeg" multiple hidden>
  <div id="ntList" class="nt-list"></div>
  <div id="ntGrid" class="grid hidden"></div>
  <div id="ntEmpty" class="empty hidden">Nog geen foto's of notities.</div>
  <div class="tags" id="ntTags"></div>
  <div class="note-row">
    <textarea id="ntText" rows="2" placeholder="Nieuwe notitie" enterkeyhint="enter"></textarea>
    <button id="ntAdd" class="save" aria-label="Toevoegen"><i data-i="check"></i></button>
  </div>
</section>

<!-- ============ DETAIL ============ -->
<section id="scrViewer" class="screen">
  <header class="bar">
    <button id="vwBack" class="ibtn" aria-label="Terug"><i data-i="chevronLeft"></i></button>
    <b id="vwTitle" class="bar-title"></b>
    <span id="vwPos" class="vw-pos"></span>
  </header>
  <div class="viewer-img">
    <img id="vwImg" alt="" draggable="false">
    <button id="vwPrev" class="vw-nav prev" aria-label="Vorige"><i data-i="chevronLeft"></i></button>
    <button id="vwNext" class="vw-nav next" aria-label="Volgende"><i data-i="chevronRight"></i></button>
  </div>
  <footer class="actions">
    <button data-vw="edit"><i data-i="edit"></i><span>Bewerk</span></button>
    <button data-vw="share"><i data-i="share"></i><span>Delen</span></button>
    <button data-vw="save"><i data-i="download"></i><span>Opslaan</span></button>
    <button data-vw="orig"><i data-i="image"></i><span>Origineel</span></button>
    <button data-vw="delete" class="danger"><i data-i="trash"></i><span>Wis</span></button>
  </footer>
</section>

<div id="sheet" class="sheet hidden"><div class="sheet-body" id="sheetBody"></div></div>
<div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyMsg"></span></div>
<div id="toast" class="toast"></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
