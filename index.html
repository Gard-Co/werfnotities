<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Werfnotities</title>
</head>
<body>

<!-- ============ CAMERA ============ -->
<section id="scrCamera" class="screen active">
  <video id="video" playsinline muted autoplay></video>
  <div id="camMsg" class="cam-msg hidden"></div>
  <div id="flash"></div>
  <header class="cam-top">
    <button id="btnProject" class="chip"><span id="projName">Kies project</span><i data-i="chevronDown"></i></button>
    <span id="gps" class="gps bad" title="Geen GPS"><i></i><b>GPS</b></span>
    <button id="btnTorch" class="glass hidden" aria-label="Zaklamp"><i data-i="flash"></i></button>
    <button id="btnSettings" class="glass" aria-label="Instellingen"><i data-i="settings"></i></button>
  </header>
  <div class="hint">Lang drukken om op te slaan zonder notitie</div>
  <footer class="cam-bottom">
    <button id="btnGallery" class="glass lg" aria-label="Foto uit galerij"><i data-i="image"></i></button>
    <button id="btnShutter" class="shutter" aria-label="Foto nemen"><span></span></button>
    <button id="btnOverview" class="glass lg thumbbtn" aria-label="Overzicht"><i data-i="grid"></i><img id="lastThumb" alt="" hidden><span id="count"></span></button>
  </footer>
  <input type="file" id="fileGallery" accept="image/*" hidden>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
</section>

<!-- ============ EDITOR ============ -->
<section id="scrEditor" class="screen">
  <header class="bar">
    <button id="edCancel" class="ibtn" aria-label="Annuleren"><i data-i="x"></i></button>
    <div class="ed-info">
      <button id="edTitle" class="ed-title"></button>
      <button id="edLoc" class="ed-loc"></button>
    </div>
  </header>
  <div class="stage" id="stage"><canvas id="edCanvas"></canvas></div>
  <div class="tools">
    <div class="seg-tools">
      <button data-tool="arrow" class="tool active" aria-label="Pijl"><i data-i="arrow"></i></button>
      <button data-tool="circle" class="tool" aria-label="Cirkel"><i data-i="circle"></i></button>
      <button data-tool="pen" class="tool" aria-label="Vrij tekenen"><i data-i="pen"></i></button>
    </div>
    <button id="edColor" class="tool" aria-label="Kleur"><span class="swatch"></span></button>
    <button id="edUndo" class="tool" aria-label="Ongedaan maken"><i data-i="undo"></i></button>
  </div>
  <div class="tags" id="edTags"></div>
  <div class="note-row">
    <textarea id="edNote" rows="2" placeholder="Notitie — of tik op de microfoon van je toetsenbord" enterkeyhint="enter"></textarea>
    <button id="edSave" class="save" aria-label="Opslaan"><i data-i="check"></i></button>
  </div>
</section>

<!-- ============ OVERZICHT ============ -->
<section id="scrOverview" class="screen">
  <header class="bar">
    <button id="ovBack" class="ibtn" aria-label="Terug"><i data-i="chevronLeft"></i></button>
    <div class="select-wrap"><select id="ovProject"></select><i data-i="chevronDown"></i></div>
    <button id="ovSelect" class="text-btn">Selecteer</button>
    <button id="ovMenu" class="ibtn" aria-label="Meer"><i data-i="more"></i></button>
  </header>
  <input type="file" id="fileImport" accept="image/jpeg" multiple hidden>
  <div id="ovGrid" class="grid"></div>
  <div id="ovEmpty" class="empty hidden">Nog geen foto's in dit project.</div>
  <footer class="actions" id="ovActions">
    <button data-act="share"><i data-i="share"></i><span>Delen</span></button>
    <button data-act="save"><i data-i="download"></i><span>Opslaan</span></button>
    <button data-act="excel"><i data-i="sheet"></i><span>Excel</span></button>
    <button data-act="pdf"><i data-i="doc"></i><span>PDF</span></button>
    <button data-act="zip"><i data-i="archive"></i><span>ZIP</span></button>
    <button data-act="delete" class="sel-only danger"><i data-i="trash"></i><span>Wis</span></button>
  </footer>
</section>

<!-- ============ DETAIL ============ -->
<section id="scrViewer" class="screen">
  <header class="bar">
    <button id="vwBack" class="ibtn" aria-label="Terug"><i data-i="chevronLeft"></i></button>
    <b id="vwTitle" class="bar-title"></b>
  </header>
  <div class="viewer-img"><img id="vwImg" alt=""></div>
  <div id="vwMeta" class="vw-meta"></div>
  <footer class="actions">
    <button data-vw="edit"><i data-i="edit"></i><span>Bewerk</span></button>
    <button data-vw="share"><i data-i="share"></i><span>Delen</span></button>
    <button data-vw="save"><i data-i="download"></i><span>Opslaan</span></button>
    <button data-vw="orig"><i data-i="image"></i><span>Origineel</span></button>
    <button data-vw="delete" class="danger"><i data-i="trash"></i><span>Wis</span></button>
  </footer>
</section>

<div id="sheet" class="sheet hidden"><div class="sheet-body" id="sheetBody"></div></div>
<div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyMsg"></span></div>
<div id="toast" class="toast"></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
